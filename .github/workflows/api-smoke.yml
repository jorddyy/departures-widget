name: API smoke test

# Checks that the public timetable API still answers and still has the shape the app expects.
# Runs weekly and on demand; it is separate from the build so an API outage never blocks a
# release. It uses a large, arbitrary station, not anyone's own stops.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - ".github/workflows/api-smoke.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Stop search and station board
        run: |
          set -euo pipefail
          curl -sS --get "https://transport.opendata.ch/v1/locations" \
            --data-urlencode "query=Bern" --data-urlencode "type=station" > locations.json
          id=$(jq -r '[.stations[] | select(.id != null and .coordinate.x != null)][0].id' locations.json)
          echo "First station id: $id"
          test -n "$id" && test "$id" != "null"

          curl -sS --get "https://transport.opendata.ch/v1/stationboard" \
            --data-urlencode "id=$id" --data-urlencode "limit=10" > board.json
          jq -c '.stationboard[] | {cat: .category, n: .number, to, dep: .stop.departure, ts: .stop.departureTimestamp, prog: .stop.prognosis.departure, delay: .stop.delay, passes: (.passList | length)}' board.json
          rows=$(jq '.stationboard | length' board.json)
          echo "rows: $rows"
          test "$rows" -gt 0
          # Fields the parser relies on.
          jq -e '.stationboard[0] | has("stop") and has("to") and has("passList") and (.stop | has("departure"))' board.json
