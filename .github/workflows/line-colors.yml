name: Line colours

# Collects official line colours from open sources (see tools/line_colors.py). Manual, or when
# the script changes; read-only.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/line_colors.py"
      - ".github/workflows/line-colors.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tools/line_colors.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: line-colors
          path: line-colors-probe.csv
