name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed only to publish the release from main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in two repository secrets (see README "Signing"), never in the repo.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
            echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            # The key alias is read from the keystore, so it never appears in the code.
            alias=$(keytool -list -keystore "$RUNNER_TEMP/signing.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | awk -F, '/PrivateKeyEntry/ { print $1; exit }')
            echo "::add-mask::$alias"   # keep the alias out of public logs
            echo "SIGNING_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: APKs use a throwaway key and won't install as updates."
          fi

      - name: Unit tests (core + app)
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: departures-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      # Every push to main replaces the "latest" release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest (tap the .apk under Assets).
      # Only builds signed with the stable key are published, so every release installs as an
      # update over the previous one. version.json is what the app reads to offer updates.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk departures.apk
          sha=$(sha256sum departures.apk | cut -d' ' -f1)
          printf '{"versionCode":%d,"versionName":"1.0.%d","commit":"%s","apkSha256":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" "$sha" > version.json
          cat version.json
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest departures.apk version.json \
            --target "$GITHUB_SHA" \
            --title "Departures (build ${{ github.run_number }})" \
            --notes "Version 1.0.${{ github.run_number }}, built from ${GITHUB_SHA::7}. Install departures.apk on your phone, or tap Update in the app." \
            --latest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
